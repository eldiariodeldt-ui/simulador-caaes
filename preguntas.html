// Renderiza las expresiones matemáticas dentro del contenido visible, no en los campos de edición.
function procesarMatematicas(elemento) {
  if (!elemento) return;
  const renderizar = () => {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetClear([elemento]);
      window.MathJax.typesetPromise([elemento]).catch(error => {
        console.error("Error al mostrar fórmulas matemáticas:", error);
      });
    }
  };

  if (window.MathJax && window.MathJax.typesetPromise) {
    renderizar();
  } else {
    document.addEventListener("mathjax-ready", renderizar, { once: true });
  }
}

// Sube una imagen al bucket existente y devuelve su URL pública.
async function subirImagenOpcion(archivo) {
  if (!archivo) return null;

  const extension = archivo.name.split(".").pop().toLowerCase();
  const nombreArchivo = `${crypto.randomUUID()}.${extension}`;

  const { error } = await supabaseClient
    .storage
    .from("question-images")
    .upload(nombreArchivo, archivo);

  if (error) throw error;

  const { data } = supabaseClient
    .storage
    .from("question-images")
    .getPublicUrl(nombreArchivo);

  return data.publicUrl;
}

}

    async function guardarEdicion(id) {

  const materia =
    document.getElementById("editar_materia").value;

  const areaId =
  document.getElementById("editar_area").value || null;    

  const pregunta =
    document.getElementById("editar_pregunta").value.trim();

  const opcionA =
    document.getElementById("editar_a").value.trim();

  const opcionB =
    document.getElementById("editar_b").value.trim();

  const opcionC =
    document.getElementById("editar_c").value.trim();

  const opcionD =
    document.getElementById("editar_d").value.trim();

  const correcta =
    Number(
      document.getElementById("editar_correcta").value
    );

  const archivoImagen =
    document.getElementById("editar_imagen").files[0];

  const tieneOpcionA = opcionA || preguntas.find(p => p.id === id)?.option_a_image_url || document.getElementById("editar_imagen_a").files[0];
  const tieneOpcionB = opcionB || preguntas.find(p => p.id === id)?.option_b_image_url || document.getElementById("editar_imagen_b").files[0];
  const tieneOpcionC = opcionC || preguntas.find(p => p.id === id)?.option_c_image_url || document.getElementById("editar_imagen_c").files[0];
  const tieneOpcionD = opcionD || preguntas.find(p => p.id === id)?.option_d_image_url || document.getElementById("editar_imagen_d").files[0];

  if (!pregunta || !tieneOpcionA || !tieneOpcionB || !tieneOpcionC || !tieneOpcionD) {
    alert("⚠️ Escribe el texto o selecciona una imagen para cada alternativa A, B, C y D.");
    return;
  }

  const datosActualizar = {
  subject: materia,
  area_id: areaId,
  question_text: pregunta,
    option_a: opcionA,
    option_b: opcionB,
    option_c: opcionC,
    option_d: opcionD,
    correct_option: correcta
  };


  /*
    SUBIR NUEVA IMAGEN SI SE SELECCIONÓ UNA
  */

  if (archivoImagen) {

    const extension =
      archivoImagen.name.split(".").pop().toLowerCase();

    const nombreArchivo =
      `${crypto.randomUUID()}.${extension}`;

    const {
      error: errorSubida
    } = await supabaseClient
      .storage
      .from("question-images")
      .upload(nombreArchivo, archivoImagen);

    if (errorSubida) {

      console.error(errorSubida);

      alert(
        "❌ No se pudo subir la nueva imagen: " +
        errorSubida.message
      );

      return;
    }

    const {
      data: urlData
    } = supabaseClient
      .storage
      .from("question-images")
      .getPublicUrl(nombreArchivo);

    datosActualizar.image_url =
      urlData.publicUrl;
  }


  // Subir imágenes nuevas para las alternativas seleccionadas.
  try {
    for (const letra of ["a", "b", "c", "d"]) {
      const archivo = document.getElementById(`editar_imagen_${letra}`).files[0];
      if (archivo) {
        datosActualizar[`option_${letra}_image_url`] = await subirImagenOpcion(archivo);
      }
    }
  } catch (errorSubida) {
    console.error(errorSubida);
    alert("❌ No se pudo subir una imagen de alternativa: " + errorSubida.message);
    return;
  }

  /*
    ACTUALIZAR PREGUNTA
  */

  const { error } = await supabaseClient
    .from("questions")
    .update(datosActualizar)
    .eq("id", id);

  if (error) {

    console.error(error);

    alert(
      "❌ No se pudo actualizar la pregunta: " +
      error.message
    );

    async function guardarPregunta() {

  const materia =
    document.getElementById("nueva_materia").value;

  const areaId =
    document.getElementById("nueva_area").value || null;

  const pregunta =
    document.getElementById("nueva_pregunta").value.trim();

  const opcionA =
    document.getElementById("nueva_a").value.trim();

  const opcionB =
    document.getElementById("nueva_b").value.trim();

  const opcionC =
    document.getElementById("nueva_c").value.trim();

  const opcionD =
    document.getElementById("nueva_d").value.trim();

  const correcta =
    Number(
      document.getElementById("nueva_correcta").value
    );

  const archivoImagen =
    document.getElementById("nueva_imagen").files[0];

  const mensaje =
    document.getElementById("mensaje_guardado");


  const archivosOpciones = {
    a: document.getElementById("nueva_imagen_a").files[0],
    b: document.getElementById("nueva_imagen_b").files[0],
    c: document.getElementById("nueva_imagen_c").files[0],
    d: document.getElementById("nueva_imagen_d").files[0]
  };

  if (
    !pregunta ||
    !(opcionA || archivosOpciones.a) ||
    !(opcionB || archivosOpciones.b) ||
    !(opcionC || archivosOpciones.c) ||
    !(opcionD || archivosOpciones.d)
  ) {
    mensaje.textContent = "⚠️ Escribe el texto o selecciona una imagen para cada alternativa A, B, C y D.";
    mensaje.style.color = "#b91c1c";
    return;
  }


  mensaje.textContent =
    "⏳ Guardando pregunta...";

  mensaje.style.color = "#374151";


  let imageUrl = null;


  /*
    SUBIR IMAGEN SI SE SELECCIONÓ UNA
  */

  if (archivoImagen) {

    const extension =
      archivoImagen.name.split(".").pop().toLowerCase();

    const nombreArchivo =
      `${crypto.randomUUID()}.${extension}`;


    const {
      error: errorSubida
    } = await supabaseClient
      .storage
      .from("question-images")
      .upload(nombreArchivo, archivoImagen);


    if (errorSubida) {

      console.error(errorSubida);

      mensaje.textContent =
        "❌ No se pudo subir la imagen: " +
        errorSubida.message;

      mensaje.style.color = "#b91c1c";

      return;
    }


    const {
      data: urlData
    } = supabaseClient
      .storage
      .from("question-images")
      .getPublicUrl(nombreArchivo);


    imageUrl =
      urlData.publicUrl;
  }


  let imagenesOpciones = {
    option_a_image_url: null,
    option_b_image_url: null,
    option_c_image_url: null,
    option_d_image_url: null
  };

  try {
    for (const letra of ["a", "b", "c", "d"]) {
      if (archivosOpciones[letra]) {
        imagenesOpciones[`option_${letra}_image_url`] = await subirImagenOpcion(archivosOpciones[letra]);
      }
    }
  } catch (errorSubida) {
    console.error(errorSubida);
    mensaje.textContent = "❌ No se pudo subir una imagen de alternativa: " + errorSubida.message;
    mensaje.style.color = "#b91c1c";
    return;
  }

  /*
    GUARDAR PREGUNTA
  */

  const {
    data,
    error
  } = await supabaseClient
    .from("questions")
    .insert({
      subject: materia,
      area_id: areaId,
      question_text: pregunta,
      image_url: imageUrl,
      option_a: opcionA,
      option_b: opcionB,
      option_c: opcionC,
      option_d: opcionD,
      ...imagenesOpciones,
      correct_option: correcta,
      active: true
    })
    .select()
    .single();


  if (error) {

    console.error(error);

    mensaje.textContent =
      "❌ No se pudo guardar: " +
      error.message;

    mensaje.style.color = "#b91c1c";

    return;
  }


  mensaje.textContent =
    "✅ Pregunta guardada correctamente.";

  mensaje.style.color = "#15803d";


  setTimeout(() => {

    cargarPreguntas();

  }, 1000);

}
