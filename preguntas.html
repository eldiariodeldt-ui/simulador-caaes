<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Preguntas | CAAES</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 30px;
      color: #111827;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
    }

    .encabezado {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .volver {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    .pregunta {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
    }

    .materia {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .texto-pregunta {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .opcion {
      padding: 8px 0;
    }

    .correcta {
      color: #15803d;
      font-weight: bold;
    }

    .estado {
      margin-top: 15px;
      font-size: 14px;
      color: #6b7280;
    }

    .cargando {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">

      <a href="admin.html" class="volver">
        ← Volver al panel
      </a>

      <h1>📝 Banco de preguntas</h1>

<p>
  Preguntas registradas actualmente en Supabase.
</p>

<button
  onclick="mostrarFormulario()"
  style="
    margin-top:15px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    cursor:pointer;
    font-size:15px;
  "
>
  ➕ Nueva pregunta
</button>

    </div>

    <div id="contenido">
      <div class="cargando">
        ⏳ Cargando preguntas...
      </div>
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://uetdixjvbxqldanjwbpg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UdFDD9V9erD05CAVy3_mFQ_oRVY8_r-";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function verificarAdministrador() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href = "login.html";

        return false;
      }


      const {
        data: administrador,
        error
      } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();


      if (error || !administrador) {

        await supabaseClient.auth.signOut();

        document.body.innerHTML = `
          <div style="
            max-width:500px;
            margin:80px auto;
            padding:30px;
            text-align:center;
            font-family:Arial;
          ">

            <h1>⛔ Acceso denegado</h1>

            <p>
              Esta cuenta no tiene permisos de administrador.
            </p>

          </div>
        `;

        return false;
      }

      return true;
    }


    async function cargarPreguntas() {

      const {
        data: preguntas,
        error
      } = await supabaseClient
        .from("questions")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      const contenido =
        document.getElementById("contenido");


      if (error) {

        contenido.innerHTML = `
          <div class="error">
            <strong>Error al cargar las preguntas.</strong>
            <br><br>
            ${error.message}
          </div>
        `;

        console.error(error);

        return;
      }


      if (!preguntas || preguntas.length === 0) {

        contenido.innerHTML = `
          <div class="cargando">
            📭 Todavía no existen preguntas registradas.
          </div>
        `;

        return;
      }


      contenido.innerHTML = preguntas.map((pregunta, indice) => {

        const respuestaCorrecta =
          pregunta[
            "option_" +
            ["a", "b", "c", "d"][
              pregunta.correct_option - 1
            ]
          ];


        return `

          <div class="pregunta">

            <div class="materia">
              ${pregunta.subject}
            </div>

            <div class="texto-pregunta">
              ${indice + 1}. ${pregunta.question_text}
            </div>

            <div class="opcion ${
              pregunta.correct_option === 1
                ? "correcta"
                : ""
            }">
              A. ${pregunta.option_a}
            </div>

            <div class="opcion ${
              pregunta.correct_option === 2
                ? "correcta"
                : ""
            }">
              B. ${pregunta.option_b}
            </div>

            <div class="opcion ${
              pregunta.correct_option === 3
                ? "correcta"
                : ""
            }">
              C. ${pregunta.option_c}
            </div>

            <div class="opcion ${
              pregunta.correct_option === 4
                ? "correcta"
                : ""
            }">
              D. ${pregunta.option_d}
            </div>

            <div class="estado">
              ${pregunta.active ? "🟢 Activa" : "🔴 Inactiva"}
            </div>

<div style="margin-top:15px;">
  <button
    onclick="editarPregunta('${pregunta.id}')"
    style="
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:14px;
    "
  >
    ✏️ Editar
  </button>
</div>
          </div>

        `;

      }).join("");
    }


    function editarPregunta(id) {

  const pregunta = preguntas.find(p => p.id === id);

  if (!pregunta) {
    alert("No se encontró la pregunta.");
    return;
  }

  const contenido = document.getElementById("contenido");

  contenido.innerHTML = `

    <div class="pregunta">

      <h2>✏️ Editar pregunta</h2>

      <label>Materia</label>

      <select id="editar_materia"
        style="
          width:100%;
          padding:10px;
          margin:8px 0 15px;
        "
      >
        <option value="Matemáticas" ${pregunta.subject === "Matemáticas" ? "selected" : ""}>Matemáticas</option>
        <option value="Lengua" ${pregunta.subject === "Lengua" ? "selected" : ""}>Lengua</option>
        <option value="Física" ${pregunta.subject === "Física" ? "selected" : ""}>Física</option>
        <option value="Química" ${pregunta.subject === "Química" ? "selected" : ""}>Química</option>
        <option value="Emprendimiento" ${pregunta.subject === "Emprendimiento" ? "selected" : ""}>Emprendimiento</option>
      </select>

      <label>Pregunta</label>

      <textarea
        id="editar_pregunta"
        style="
          width:100%;
          min-height:100px;
          padding:10px;
          margin:8px 0 15px;
        "
      >${pregunta.question_text}</textarea>

      <label>Opción A</label>
      <input
        id="editar_a"
        value="${pregunta.option_a}"
        style="width:100%;padding:10px;margin:8px 0 15px;"
      >

      <label>Opción B</label>
      <input
        id="editar_b"
        value="${pregunta.option_b}"
        style="width:100%;padding:10px;margin:8px 0 15px;"
      >

      <label>Opción C</label>
      <input
        id="editar_c"
        value="${pregunta.option_c}"
        style="width:100%;padding:10px;margin:8px 0 15px;"
      >

      <label>Opción D</label>
      <input
        id="editar_d"
        value="${pregunta.option_d}"
        style="width:100%;padding:10px;margin:8px 0 15px;"
      >

      <label>Respuesta correcta</label>

      <select
        id="editar_correcta"
        style="
          width:100%;
          padding:10px;
          margin:8px 0 15px;
        "
      >
        <option value="1" ${pregunta.correct_option === 1 ? "selected" : ""}>A</option>
        <option value="2" ${pregunta.correct_option === 2 ? "selected" : ""}>B</option>
        <option value="3" ${pregunta.correct_option === 3 ? "selected" : ""}>C</option>
        <option value="4" ${pregunta.correct_option === 4 ? "selected" : ""}>D</option>
      </select>

      <button
        onclick="guardarEdicion('${pregunta.id}')"
        style="
          padding:12px 18px;
          border:none;
          border-radius:8px;
          background:#2563eb;
          color:white;
          cursor:pointer;
          font-size:15px;
        "
      >
        💾 Guardar cambios
      </button>

      <button
        onclick="cargarPreguntas()"
        style="
          padding:12px 18px;
          border:none;
          border-radius:8px;
          background:#6b7280;
          color:white;
          cursor:pointer;
          font-size:15px;
          margin-left:8px;
        "
      >
        Cancelar
      </button>

    </div>
  `;
}

    
    function mostrarFormulario() {

  const contenido =
    document.getElementById("contenido");

  contenido.innerHTML = `

    <div class="pregunta">

      <h2>➕ Nueva pregunta</h2>

      <label>
        Materia
      </label>

      <select id="nueva_materia"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >
        <option value="Matemáticas">Matemáticas</option>
        <option value="Lengua">Lengua</option>
        <option value="Física">Física</option>
        <option value="Química">Química</option>
        <option value="Emprendimiento">Emprendimiento</option>
      </select>


      <label>
        Pregunta
      </label>

      <textarea
        id="nueva_pregunta"
        rows="4"
        placeholder="Escribe aquí la pregunta..."
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
          resize:vertical;
        "
      ></textarea>


      <label>
        Opción A
      </label>

      <input
        id="nueva_a"
        type="text"
        placeholder="Opción A"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >


      <label>
        Opción B
      </label>

      <input
        id="nueva_b"
        type="text"
        placeholder="Opción B"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >


      <label>
        Opción C
      </label>

      <input
        id="nueva_c"
        type="text"
        placeholder="Opción C"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >


      <label>
        Opción D
      </label>

      <input
        id="nueva_d"
        type="text"
        placeholder="Opción D"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 15px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >


      <label>
        Respuesta correcta
      </label>

      <select
        id="nueva_correcta"
        style="
          width:100%;
          padding:12px;
          margin:8px 0 20px;
          border-radius:8px;
          border:1px solid #d1d5db;
        "
      >
        <option value="1">A</option>
        <option value="2">B</option>
        <option value="3">C</option>
        <option value="4">D</option>
      </select>


      <button
        onclick="guardarPregunta()"
        style="
          padding:12px 18px;
          border:none;
          border-radius:10px;
          background:#15803d;
          color:white;
          cursor:pointer;
          font-size:15px;
          margin-right:8px;
        "
      >
        💾 Guardar pregunta
      </button>


      <button
        onclick="cargarPreguntas()"
        style="
          padding:12px 18px;
          border:none;
          border-radius:10px;
          background:#6b7280;
          color:white;
          cursor:pointer;
          font-size:15px;
        "
      >
        Cancelar
      </button>

      <div
        id="mensaje_guardado"
        style="
          margin-top:15px;
          font-weight:bold;
        "
      ></div>

    </div>

  `;
}


    async function guardarPregunta() {

  const materia =
    document.getElementById("nueva_materia").value;

  const pregunta =
    document.getElementById("nueva_pregunta").value.trim();

  const opcionA =
    document.getElementById("nueva_a").value.trim();

  const opcionB =
    document.getElementById("nueva_b").value.trim();

  const opcionC =
    document.getElementById("nueva_c").value.trim();

  const opcionD =
    document.getElementById("nueva_d").value.trim();

  const correcta =
    Number(
      document.getElementById("nueva_correcta").value
    );

  const mensaje =
    document.getElementById("mensaje_guardado");


  if (
    !pregunta ||
    !opcionA ||
    !opcionB ||
    !opcionC ||
    !opcionD
  ) {

    mensaje.textContent =
      "⚠️ Completa todos los campos.";

    mensaje.style.color = "#b91c1c";

    return;
  }


  mensaje.textContent =
    "⏳ Guardando pregunta...";

  mensaje.style.color = "#374151";


  const {
    data,
    error
  } = await supabaseClient
    .from("questions")
    .insert({
      subject: materia,
      question_text: pregunta,
      option_a: opcionA,
      option_b: opcionB,
      option_c: opcionC,
      option_d: opcionD,
      correct_option: correcta,
      active: true
    })
    .select()
    .single();


  if (error) {

    console.error(error);

    mensaje.textContent =
      "❌ No se pudo guardar: " +
      error.message;

    mensaje.style.color = "#b91c1c";

    return;
  }


  mensaje.textContent =
    "✅ Pregunta guardada correctamente.";

  mensaje.style.color = "#15803d";


  setTimeout(() => {

    cargarPreguntas();

  }, 1000);

}


    async function iniciar() {

      const autorizado =
        await verificarAdministrador();

      if (!autorizado) return;

      await cargarPreguntas();

    }


    iniciar();

  </script>

</body>
</html>
