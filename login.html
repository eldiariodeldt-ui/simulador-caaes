<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso Administrador CAAES</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
      margin: 20px;
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .exito {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

  <div class="login">

    <div class="logo">🎓</div>

    <h1>CAAES</h1>

    <div class="subtitulo">
      Acceso al panel de administración
    </div>

    <form id="formularioLogin">

      <label for="email">
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        placeholder="Correo del administrador"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        required
      >

      <button
        type="submit"
        id="botonLogin"
      >
        Iniciar sesión
      </button>

    </form>

    <div id="mensaje"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://uetdixjvbxqldanjwbpg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UdFDD9V9erD05CAVy3_mFQ_oRVY8_r-";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const formulario =
      document.getElementById("formularioLogin");

    const mensaje =
      document.getElementById("mensaje");

    const botonLogin =
      document.getElementById("botonLogin");


    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        mensaje.style.display = "none";

        botonLogin.disabled = true;

        botonLogin.textContent =
          "Ingresando...";


        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {

          mensaje.className = "error";

          mensaje.textContent =
            "Correo o contraseña incorrectos.";

          mensaje.style.display = "block";

          botonLogin.disabled = false;

          botonLogin.textContent =
            "Iniciar sesión";

          return;
        }


        if (data.session) {

          mensaje.className = "exito";

          mensaje.textContent =
            "Inicio de sesión correcto. Entrando...";

          mensaje.style.display = "block";

          setTimeout(() => {

            window.location.href =
              "admin.html";

          }, 700);

        }

      }
    );

  </script>

</body>
</html>
